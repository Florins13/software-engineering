# Bike Service Configuration
quarkus.http.port=8081
quarkus.http.host=0.0.0.0

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/bike_db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Kafka
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.stock-reserve.connector=smallrye-kafka
mp.messaging.incoming.stock-reserve.topic=stock.reserve
mp.messaging.incoming.stock-reserve.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.stock-reserve.group.id=bike-service

mp.messaging.incoming.stock-release.connector=smallrye-kafka
mp.messaging.incoming.stock-release.topic=stock.release
mp.messaging.incoming.stock-release.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.stock-release.group.id=bike-service

mp.messaging.outgoing.stock-reserved.connector=smallrye-kafka
mp.messaging.outgoing.stock-reserved.topic=stock.reserved
mp.messaging.outgoing.stock-reserved.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.stock-insufficient.connector=smallrye-kafka
mp.messaging.outgoing.stock-insufficient.topic=stock.insufficient
mp.messaging.outgoing.stock-insufficient.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.stock-confirm.connector=smallrye-kafka
mp.messaging.incoming.stock-confirm.topic=stock.confirm
mp.messaging.incoming.stock-confirm.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.stock-confirm.group.id=bike-service
